<div class="user-card">
  <div class="user-info-wrapper">
    <img [src]="user.avatar_url" alt="{{ user.login }}" class="user-avatar">
    <div>
      <h3 class="user-name">{{ user.name || user.login }}</h3>
      <p class="user-username">&#64;{{ user.login }}</p>
      <p *ngIf="user.bio" class="user-bio">{{ user.bio }}</p>

      <div class="user-stats">
        <span><strong>{{ user.public_repos }}</strong> Repos</span>
        <span><strong>{{ user.followers }}</strong> Followers</span>
        <span><strong>{{ user.following }}</strong> Following</span>
      </div>

      <a [routerLink]="['/user', user.login]" class="view-profile-link">View Profile</a>
    </div>
  </div>
</div>
